<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/img/favicon.png">
<meta name="description" content="ПЕКЛО — игра по роману «ТехноШаман». Семь ролей, у каждой своя механика.">
<meta name="theme-color" content="#050505">
<title>ПЕКЛО · игра</title>
<link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>

<!-- ── выбор роли ─────────────────────────────────────────────── -->
<section id="pick" class="screen">
  <img class="brand" src="assets/img/logo.png" alt="">
  <div class="inner">
    <div class="kick">пекло · ночь третья</div>
    <h1>Кем ты сегодня</h1>
    <div class="rule"></div>

    <div class="roles">
      <button class="role" data-who="shaman-field">
        <span class="n">Шаман · настройка</span>
        <span class="t">Вести</span>
        <span class="d">Резонанс — это совпадение, а не громкость. Води Организм по полю и лови чужую частоту. Совпал — он греется. Цель уходит, её надо вести, а дёргаться нельзя: под рваную музыку не танцуют.</span>
        <span class="go">вести →</span>
      </button>

      <button class="role" data-who="shaman-beat">
        <span class="n">Шаман · ритм</span>
        <span class="t">Играть</span>
        <span class="d">Зеркало Танцующего: ноты идут по трём трубкам Организма. Нота пришла — бей, длинная — тяни. Пока слой звучит, зал по нему греется.</span>
        <span class="go">играть →</span>
      </button>

      <button class="role" data-who="dancer">
        <span class="n">Танцующий</span>
        <span class="t">Не сбиться</span>
        <span class="d">Ты в зале, пол уже тёплый. Три часа. Три дорожки — доум, тек, шейкер: те самые голоса, что сейчас бьют. Работа одна — не сбиться.</span>
        <span class="go">войти →</span>
      </button>

      <button class="role" data-who="photo">
        <span class="n">Фотограф</span>
        <span class="t">Ловить</span>
        <span class="d">Работай фрагментами: целое отвлекает. Молчание — ресурс. Не сказала слова — она старается сильнее, кадр дороже, а натура горячее.</span>
        <span class="go">снимать →</span>
      </button>

      <button class="role" data-who="kaze">
        <span class="n">Казе</span>
        <span class="t">Нырять</span>
        <span class="d">Погружение в чужое сознание: мир без изображений, плотный от звука. Глубже — больше видишь, но там она. Решай каждую секунду: ещё ниже или наверх.</span>
        <span class="go">погрузиться →</span>
      </button>

      <button class="role" data-who="fresher">
        <span class="n">Фрешер</span>
        <span class="t">Гнать</span>
        <span class="d">Бесконечная трасса, в воздухе пепел, а свет всё время меняет способ видеть: уголь, кислота, тепловизор, выжженный. Всё решает одно: успеть сбросить до того, как дорога согнётся.</span>
        <span class="go">рвануть →</span>
      </button>

      <button class="role" data-who="madam">
        <span class="n">Мадам</span>
        <span class="t">Просачиваться</span>
        <span class="d">Ты поёшь сверху и входишь в чужую музыку. Идти надо не по волне, а против неё — во впадины. Он сопротивляется и меняет частоту.</span>
        <span class="go">петь →</span>
      </button>

      <button class="role" data-who="model">
        <span class="n">Модель</span>
        <span class="t">Поднимать</span>
        <span class="d">Выиграть нельзя. Признание не сдвинется ни разу, и это видно с первой секунды. Играется только то, как высоко успеешь поднять ставку.</span>
        <span class="go">выйти в зал →</span>
      </button>

      <button class="role dim" data-who="shaman-hold">
        <span class="n">Шаман · удержание</span>
        <span class="t">Держать</span>
        <span class="d">Первый вариант, самый простой: три трубки, держи две из трёх. Оставлен для сравнения — решение тут принимается один раз.</span>
        <span class="go">держать →</span>
      </button>
    </div>
  </div>
</section>

<!-- ── Шаман ──────────────────────────────────────────────────── -->
<section id="shaman" class="screen game">
  <header class="hud">
    <div class="who">Шаман</div>
    <div class="madam-wrap">
      <span class="lab">Мадам</span>
      <div id="madam" class="bar"><i></i></div>
    </div>
    <button class="quit" aria-label="Выйти">выйти</button>
  </header>

  <div class="listen">
    <!-- слой свечения лежит под линиями: там свет, здесь чёткое -->
    <canvas id="hall-gl"></canvas>
    <canvas id="hall"></canvas>
    <div class="modes">
      <span class="ml">зал</span>
      <button class="m on" data-mode="near">ближайший</button>
      <button class="m" data-mode="all">весь</button>
      <button class="m" data-mode="dim">смутно</button>
    </div>
  </div>

  <canvas id="scope"></canvas>

  <!-- поле настройки: только в варианте «вести». Стоит отдельно от зала
       намеренно — водить точку по головам читалось бы как прицеливание -->
  <div class="padwrap"><canvas id="pad"></canvas><span class="pl">поле настройки Организма</span></div>

  <div class="tubes">
    <button id="tube-drone" class="tube"><i></i><b></b><span class="tl">дрон</span><span class="tk">1</span></button>
    <button id="tube-drum"  class="tube"><i></i><b></b><span class="tl">дарбука</span><span class="tk">2</span></button>
    <button id="tube-choir" class="tube"><i></i><b></b><span class="tl">хор</span><span class="tk">3</span></button>
  </div>
  <p class="tip" id="sh-tip"></p>
</section>

<!-- ── Танцующий ──────────────────────────────────────────────── -->
<section id="dancer" class="screen game">
  <header class="hud">
    <div class="who">Танцующий</div>
    <div class="madam-wrap">
      <span class="lab">резонанс</span>
      <div id="res" class="bar hot"><i></i></div>
    </div>
    <button class="quit" aria-label="Выйти">выйти</button>
  </header>

  <div id="floorwrap" class="floor">
    <canvas id="floor-gl"></canvas>
    <canvas id="floor"></canvas>
    <div id="phase" class="phase"></div>
    <div id="combo" class="combo"></div>
  </div>
  <p class="tip">Три голоса дарбуки — три дорожки. Жми ту, по которой пришла нота, в момент, когда она садится на линию. Пальцем по своей трети экрана, с клавиатуры — <b>A S D</b>.</p>
</section>

<!-- ── общий экран пяти персонажей ────────────────────────────── -->
<section id="arcade" class="screen game">
  <header class="hud">
    <div class="who" id="ar-who"></div>
    <div class="madam-wrap">
      <span class="lab" id="ar-la"></span>
      <div id="ar-a" class="bar"><i></i></div>
      <span class="lab" id="ar-lb"></span>
      <div id="ar-b" class="bar hot"><i></i></div>
    </div>
    <button class="quit" aria-label="Выйти">выйти</button>
  </header>

  <div class="arena"><canvas id="arena-gl"></canvas><canvas id="arena"></canvas><div id="ar-count" class="combo"></div></div>
  <button id="ar-speak" class="speak">сказать слово</button>
  <p class="tip" id="ar-tip"></p>
</section>

<!-- ── финал ──────────────────────────────────────────────────── -->
<section id="end" class="screen">
  <div class="inner">
    <div id="end-kick" class="kick"></div>
    <h1 id="end-title"></h1>
    <div class="rule"></div>
    <p id="end-body" class="body"></p>
    <button class="again">ещё раз</button>
    <a class="back" href="https://lleiman.github.io/chapter-site/">читать главу →</a>
  </div>
</section>

<!-- ── ворота ─────────────────────────────────────────────────── -->
<div id="gate">
  <button id="burn" type="button" aria-label="Burn me — войти">
    <span class="scale" aria-hidden="true"></span>
    <span class="ring" aria-hidden="true"></span>
    <span class="iris" aria-hidden="true"></span>
    <span class="lab">Burn me</span>
  </button>
</div>

<script src="assets/js/glow.js?v=8" defer></script>
<script src="assets/js/road.js?v=8" defer></script>
<script src="assets/js/ash.js?v=8" defer></script>
<script src="assets/js/lanes.js?v=8" defer></script>
<script src="assets/js/sound.js?v=8" defer></script>
<script src="assets/js/arcade.js?v=8" defer></script>
<script src="assets/js/game.js?v=8" defer></script>
</body>
</html>
